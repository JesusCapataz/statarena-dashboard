<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="StatArena — Plataforma profesional de estadísticas deportivas en tiempo real." />
  <title>StatArena · Analítica Deportiva Profesional</title>
  <link rel="preconnect" href="#" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2310e6a4'/%3E%3Cpath d='M50 18a32 32 0 1 0 0 64 32 32 0 0 0 0-64zm0 10 8 6-3 9h-10l-3-9z' fill='%230b0f14'/%3E%3C/svg%3E" />
</head>
<body>
  <!-- ============ APP SHELL ============ -->
  <div class="app" id="app">

    <!-- ---------- SIDEBAR ---------- -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 100 100" width="34" height="34">
            <rect width="100" height="100" rx="24" fill="url(#bg)"/>
            <path d="M50 20a30 30 0 1 0 0 60 30 30 0 0 0 0-60zm0 9 9 6.5-3.4 10.6H44.4L41 35.5z" fill="#0b0f14"/>
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#10e6a4"/>
                <stop offset="1" stop-color="#0bb3d8"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand__text">
          <span class="brand__name">StatArena</span>
          <span class="brand__tag">Sports Analytics</span>
        </div>
        <button class="sidebar__collapse" id="sidebarCollapse" title="Contraer menú" aria-label="Contraer menú">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <nav class="nav" aria-label="Navegación principal">
        <p class="nav__label">General</p>
        <a href="#resumen" class="nav__item is-active" data-view="resumen">
          <svg viewBox="0 0 24 24" class="nav__icon"><path d="M4 13h7V4H4v9zm0 7h7v-5H4v5zm9 0h7v-9h-7v9zm0-16v5h7V4h-7z"/></svg>
          <span>Resumen</span>
        </a>
        <a href="#partidos" class="nav__item" data-view="partidos">
          <svg viewBox="0 0 24 24" class="nav__icon"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 3.5l2.4 1.7-.9 2.8h-3l-.9-2.8L12 5.5zM6.2 9.9l2.7.2 1 2.7-2 1.9-2.5-1.2A8 8 0 016.2 9.9zm11.6 0a8 8 0 01.8 3.6l-2.5 1.2-2-1.9 1-2.7 2.7-.2zM9.8 19.2A8 8 0 017 17l.6-2.6 2.7-.3 1.4 2.4-1 2.6-.9.1zm5.3-.1l-.9-.1-1-2.6 1.4-2.4 2.7.3.6 2.6a8 8 0 01-2.8 2.2z"/></svg>
          <span>Partidos</span>
          <span class="nav__badge live">EN VIVO</span>
        </a>
        <a href="#clasificacion" class="nav__item" data-view="clasificacion">
          <svg viewBox="0 0 24 24" class="nav__icon"><path d="M5 21V8H2l10-6 10 6h-3v13h-5v-7h-4v7H5z"/></svg>
          <span>Clasificación</span>
        </a>
        <a href="#equipos" class="nav__item" data-view="equipos">
          <svg viewBox="0 0 24 24" class="nav__icon"><path d="M16 11a4 4 0 10-4-4 4 4 0 004 4zm-8 1a3 3 0 10-3-3 3 3 0 003 3zm0 2c-2.7 0-6 1.3-6 4v3h7v-3c0-1 .4-2 1.2-2.8C9.4 14.4 8.7 14 8 14zm8-1c-3 0-7 1.5-7 4.5V21h14v-3.5c0-3-4-4.5-7-4.5z"/></svg>
          <span>Equipos</span>
        </a>
        <a href="#jugadores" class="nav__item" data-view="jugadores">
          <svg viewBox="0 0 24 24" class="nav__icon"><path d="M12 12a5 5 0 10-5-5 5 5 0 005 5zm0 2c-4 0-9 2-9 6v2h18v-2c0-4-5-6-9-6z"/></svg>
          <span>Jugadores</span>
        </a>

        <p class="nav__label">Analítica</p>
        <a href="#estadisticas" class="nav__item" data-view="estadisticas">
          <svg viewBox="0 0 24 24" class="nav__icon"><path d="M3 3h2v18H3V3zm4 10h3v8H7v-8zm5-6h3v14h-3V7zm5 3h3v11h-3V10z"/></svg>
          <span>Estadísticas</span>
        </a>
        <a href="#comparador" class="nav__item" data-view="comparador">
          <svg viewBox="0 0 24 24" class="nav__icon"><path d="M9 3H4a1 1 0 00-1 1v16a1 1 0 001 1h5V3zm11 0h-5v18h5a1 1 0 001-1V4a1 1 0 00-1-1z"/></svg>
          <span>Comparador</span>
        </a>
      </nav>

      <div class="sidebar__footer">
        <div class="upsell">
          <div class="upsell__icon">★</div>
          <div class="upsell__body">
            <strong>StatArena Pro</strong>
            <span>Datos avanzados xG, heatmaps y export.</span>
          </div>
          <button class="btn btn--sm btn--primary">Mejorar</button>
        </div>
      </div>
    </aside>

    <!-- ---------- MAIN ---------- -->
    <div class="main">

      <!-- TOPBAR -->
      <header class="topbar">
        <button class="icon-btn topbar__menu" id="menuToggle" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>

        <div class="topbar__title">
          <h1 id="pageTitle">Resumen de la temporada</h1>
          <p id="pageSubtitle">Temporada 2025/26 · Jornada 32 de 38</p>
        </div>

        <div class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" class="search__icon"><path d="M21 21l-4.3-4.3M11 19a8 8 0 110-16 8 8 0 010 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" id="globalSearch" placeholder="Buscar equipos, jugadores…" aria-label="Buscar" />
          <kbd>/</kbd>
        </div>

        <div class="topbar__actions">
          <div class="league-pick">
            <select id="leagueSelect" aria-label="Seleccionar competición">
              <option value="laliga">🇪🇸 LaLiga</option>
              <option value="premier">🏴 Premier League</option>
              <option value="seriea">🇮🇹 Serie A</option>
              <option value="bundesliga">🇩🇪 Bundesliga</option>
            </select>
          </div>

          <button class="icon-btn" id="themeToggle" aria-label="Cambiar tema" title="Cambiar tema">
            <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 109.8 9.8z" fill="currentColor"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20"><path d="M12 17a5 5 0 100-10 5 5 0 000 10zm0-13v3m0 14v3M4 12H1m22 0h-3M5.6 5.6L3.5 3.5m17 17l-2.1-2.1M5.6 18.4l-2.1 2.1m17-17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>

          <button class="icon-btn icon-btn--dot" aria-label="Notificaciones">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 22a2.5 2.5 0 002.45-2h-4.9A2.5 2.5 0 0012 22zm7-6V11a7 7 0 10-14 0v5l-2 2v1h18v-1l-2-2z" fill="currentColor"/></svg>
          </button>

          <button class="user" aria-label="Perfil de usuario">
            <span class="user__avatar">CM</span>
            <span class="user__meta">
              <span class="user__name">Carlos M.</span>
              <span class="user__role">Analista</span>
            </span>
          </button>
        </div>
      </header>

      <!-- VIEWS CONTAINER -->
      <main class="content" id="content">
        <!-- Las vistas se inyectan vía JS -->
        <div class="loader" id="loader">
          <div class="loader__spinner"></div>
          <p>Cargando datos de la competición…</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts (módulos, sin dependencias externas) -->
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
